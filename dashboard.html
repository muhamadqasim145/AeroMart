<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dashboard - AeroMart</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 25%, #7e8ba3 50%, #b8c5d1 75%, #e8f0f8 100%);
      background-attachment: fixed;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      position: relative;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(55, 232, 235, 0.15) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    
    main {
      position: relative;
      z-index: 1;
    }
    
    .dashboard-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .dashboard-header {
      color: #ffffff;
      margin-bottom: 30px;
    }
    
    .dashboard-header h1 {
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 10px 0;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .stat-card {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .stat-icon {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }
    
    .stat-icon.sales { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .stat-icon.revenue { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
    .stat-icon.profit { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    .stat-icon.products { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
    
    .stat-content h3 {
      margin: 0;
      font-size: 14px;
      color: #666;
      font-weight: 500;
    }
    
    .stat-content .value {
      font-size: 28px;
      font-weight: 700;
      color: #1e3c72;
      margin: 5px 0 0 0;
    }
    
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .chart-card {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    
    .chart-card h2 {
      color: #1e3c72;
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 20px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .chart-container {
      position: relative;
      height: 300px;
    }
    
    @media (max-width: 768px) {
      .charts-grid {
        grid-template-columns: 1fr;
      }
      
      .chart-container {
        height: 250px;
      }
    }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <main class="dashboard-container">
    <div class="dashboard-header">
      <h1>📊 Sales Dashboard</h1>
      <p style="color: rgba(255,255,255,0.9); margin: 0;">Analytics and insights for your e-commerce store</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon sales">💰</div>
        <div class="stat-content">
          <h3>Total Sales</h3>
          <div class="value" id="total-sales">0</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon revenue">💵</div>
        <div class="stat-content">
          <h3>Total Revenue</h3>
          <div class="value" id="total-revenue">$0.00</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon profit">📈</div>
        <div class="stat-content">
          <h3>Total Profit</h3>
          <div class="value" id="total-profit">$0.00</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon products">📦</div>
        <div class="stat-content">
          <h3>Total Products</h3>
          <div class="value" id="total-products">0</div>
        </div>
      </div>
    </div>
    
    <div class="charts-grid">
      <div class="chart-card">
        <h2>📊 Most Sold Products</h2>
        <div class="chart-container">
          <canvas id="salesChart"></canvas>
        </div>
      </div>
      
      <div class="chart-card">
        <h2>💵 Revenue by Product</h2>
        <div class="chart-container">
          <canvas id="revenueChart"></canvas>
        </div>
      </div>
      
      <div class="chart-card">
        <h2>📈 Profit Analysis</h2>
        <div class="chart-container">
          <canvas id="profitChart"></canvas>
        </div>
      </div>
      
      <div class="chart-card">
        <h2>🏆 Top Products by Sales</h2>
        <div class="chart-container">
          <canvas id="topProductsChart"></canvas>
        </div>
      </div>
    </div>
  </main>
  
  <footer class="footer">
    <div class="container"><div class="small muted">© 2025 AeroMart</div></div>
  </footer>
  
  <script src="products.js"></script>
  <script src="main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", ()=>{
      renderHeader();
      
      // Calculate statistics
      const totalSales = PRODUCTS.reduce((sum, p) => sum + (p.sold || 0), 0);
      const totalRevenue = PRODUCTS.reduce((sum, p) => sum + (p.price * (p.sold || 0)), 0);
      const totalProfit = PRODUCTS.reduce((sum, p) => {
        const profit = (p.price - (p.cost || 0)) * (p.sold || 0);
        return sum + profit;
      }, 0);
      
      document.getElementById("total-sales").textContent = totalSales.toLocaleString();
      document.getElementById("total-revenue").textContent = "$" + totalRevenue.toFixed(2).toLocaleString();
      document.getElementById("total-profit").textContent = "$" + totalProfit.toFixed(2).toLocaleString();
      document.getElementById("total-products").textContent = PRODUCTS.length;
      
      // Sort products by sales
      const sortedBySales = [...PRODUCTS].sort((a, b) => (b.sold || 0) - (a.sold || 0));
      const topProducts = sortedBySales.slice(0, 8);
      
      // Sales Chart (Bar Chart)
      const salesCtx = document.getElementById("salesChart").getContext("2d");
      new Chart(salesCtx, {
        type: "bar",
        data: {
          labels: topProducts.map(p => p.title.length > 20 ? p.title.substring(0, 20) + "..." : p.title),
          datasets: [{
            label: "Units Sold",
            data: topProducts.map(p => p.sold || 0),
            backgroundColor: "rgba(30, 60, 114, 0.8)",
            borderColor: "rgba(30, 60, 114, 1)",
            borderWidth: 2,
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                precision: 0
              }
            }
          }
        }
      });
      
      // Revenue Chart (Line Chart)
      const revenueCtx = document.getElementById("revenueChart").getContext("2d");
      new Chart(revenueCtx, {
        type: "line",
        data: {
          labels: topProducts.map(p => p.title.length > 15 ? p.title.substring(0, 15) + "..." : p.title),
          datasets: [{
            label: "Revenue ($)",
            data: topProducts.map(p => (p.price * (p.sold || 0)).toFixed(2)),
            borderColor: "rgba(55, 232, 235, 1)",
            backgroundColor: "rgba(55, 232, 235, 0.1)",
            borderWidth: 3,
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              position: "top"
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                callback: function(value) {
                  return "$" + value.toLocaleString();
                }
              }
            }
          }
        }
      });
      
      // Profit Chart (Doughnut Chart)
      const profitCtx = document.getElementById("profitChart").getContext("2d");
      const profitData = topProducts.map(p => {
        return ((p.price - (p.cost || 0)) * (p.sold || 0));
      });
      new Chart(profitCtx, {
        type: "doughnut",
        data: {
          labels: topProducts.map(p => p.title.length > 15 ? p.title.substring(0, 15) + "..." : p.title),
          datasets: [{
            data: profitData,
            backgroundColor: [
              "rgba(30, 60, 114, 0.8)",
              "rgba(55, 232, 235, 0.8)",
              "rgba(42, 82, 152, 0.8)",
              "rgba(126, 139, 163, 0.8)",
              "rgba(184, 197, 209, 0.8)",
              "rgba(255, 165, 0, 0.8)",
              "rgba(46, 125, 50, 0.8)",
              "rgba(156, 39, 176, 0.8)"
            ],
            borderWidth: 2,
            borderColor: "#ffffff"
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: "right",
              labels: {
                boxWidth: 12,
                font: {
                  size: 11
                }
              }
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return "$" + context.parsed.toFixed(2);
                }
              }
            }
          }
        }
      });
      
      // Top Products Chart (Horizontal Bar)
      const topProductsCtx = document.getElementById("topProductsChart").getContext("2d");
      new Chart(topProductsCtx, {
        type: "bar",
        data: {
          labels: topProducts.slice(0, 5).map(p => p.title.length > 18 ? p.title.substring(0, 18) + "..." : p.title),
          datasets: [{
            label: "Sales",
            data: topProducts.slice(0, 5).map(p => p.sold || 0),
            backgroundColor: "rgba(55, 232, 235, 0.8)",
            borderColor: "rgba(55, 232, 235, 1)",
            borderWidth: 2,
            borderRadius: 8
          }]
        },
        options: {
          indexAxis: "y",
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            x: {
              beginAtZero: true,
              ticks: {
                precision: 0
              }
            }
          }
        }
      });
    });
  </script>
  <script src="keyboard-navigation.js"></script>
</body>
</html>
